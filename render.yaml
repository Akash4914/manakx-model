services:
  - type: web
    name: manakx-model-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn manakx_model.api.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MANAKX_ALLOWED_ORIGINS
        value: "https://manakx.vercel.app"
      # Optional — only needed if you want real LLM ranking/translation
      # instead of the rule-based fallback:
      # - key: ANTHROPIC_API_KEY
      #   sync: false
